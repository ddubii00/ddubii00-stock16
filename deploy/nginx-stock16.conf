# Include within the existing HTTPS server block. Preserve the subpath upstream.
# Match proxy port to STOCK16_PORT selected by install.sh.
location = /stock16-7 { return 308 /stock16-7/; }
location /stock16-7/ {
    proxy_pass http://127.0.0.1:3016;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 95s;
    client_max_body_size 64k;
    # Per-IP limits are also enforced server side. Do not trust arbitrary XFF.
}
