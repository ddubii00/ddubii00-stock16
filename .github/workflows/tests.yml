name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q stock16
      - run: node --check stock16/static/app.js
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: pip check
      - name: Verify systemd worker and weekly units
        run: |
          sudo mkdir -p /var/www/stock16-7/.venv/bin
          sudo ln -s "$(command -v python)" /var/www/stock16-7/.venv/bin/python
          systemd-analyze verify deploy/stock16-collector-worker.service deploy/stock16-weekly.service deploy/stock16-weekly.timer
